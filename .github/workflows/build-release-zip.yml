name: Build release zip

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify-build:
    name: Verify build
    uses: ./.github/workflows/verify-build.yml

  build:
    name: Build release zip
    needs: verify-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Generate ZIP file
        uses: 10up/action-wordpress-plugin-build-zip@b9e621e1261ccf51592b6f3943e4dc4518fca0d1 # 1.0.2
        env:
          SLUG: ${{ vars.SLUG }}
