name: Verify build

# Rebuilds the minified admin assets from a clean, lockfile-exact install
# (no install scripts) and fails if the result differs from what is committed.
# Release jobs ship the committed files, so they never need to run npm.
on:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Rebuild assets and compare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - name: Set npm version
        run: npm install --global --ignore-scripts npm@11.16.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Fail if built assets differ from committed files
        run: |
          if [ -n "$(git status --porcelain -- admin/js admin/css)" ]; then
            echo "::error::Built assets differ from the committed files. Run 'npm ci && npm run build' and commit admin/js and admin/css."
            git status --porcelain -- admin/js admin/css
            git diff --stat -- admin/js admin/css
            exit 1
          fi
