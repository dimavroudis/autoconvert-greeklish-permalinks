name: Plugin asset/readme update
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # Only readme.txt and .wordpress-org/ assets are pushed, so no build is needed.
  # This job holds the SVN credentials: keep npm out of it.
  trunk:
    name: Push to trunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ${{ vars.SLUG }}
